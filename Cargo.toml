[workspace]
resolver = "2"
members = [
    "crates/iptv-core",
    "crates/iptv-app", "crates/iptv-vlc", "crates/iptv-signer", "crates/iptv-sapi",
]

[workspace.package]
edition = "2021"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
iptv-core = { path = "crates/iptv-core" }
# default-features = false for exactly one reason: wxdragon's
# defaults include wx-asserts, which builds wxWidgets with
# its internal consistency checks live — every failed check
# becomes a modal "debugging check" dialog for the end user,
# even in release builds (tree root expand, wxMenu::Delete,
# EndRepositioningChildren — validation 0095). Release wx
# builds compile those checks out, as wxPython ships. Every
# other default is re-enabled in iptv-app's feature list, so
# the ONLY build change is the assert dialogs. (Cargo only
# honors default-features at this workspace definition; the
# member crate's setting is ignored.)
wxdragon = { version = "0.9.24", default-features = false }
live-region = "0.3.3"
serde_json = "1"
sha2 = "0.11"
ureq = "3"
quick-xml = "0.42"
flate2 = "1"
fs4 = "1.1.0"
chrono = "0.4"
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
libloading = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
hmac = "0.13"
pbkdf2 = "0.13"
base64 = "0.23"
getrandom = "0.4"
rust_cast = { package = "chromecast", version = "0.18" }
mdns-sd = "0.21"
libc = "0.2"

[patch.crates-io]
# ship-shape fork: configurable API base URL for Forgejo-hosted releases (upstream: trypsynth/ship-shape).
ship-shape = { git = "https://git.serrebiradio.com/serrebi/ship-shape", rev = "cff6bdb5596676723b3a0890b1b030c8edac0d28" }
