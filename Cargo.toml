[workspace]
resolver = "2"
members = [
    "crates/iptv-core",
    "crates/iptv-app",
]

[workspace.package]
edition = "2021"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
iptv-core = { path = "crates/iptv-core" }
wxdragon = "=0.9.24"
live-region = "=0.3.3"
serde_json = "1"
