[workspace]
resolver = "2"
members = [
    "crates/iptv-core",
    "crates/iptv-app", "crates/iptv-vlc", "crates/iptv-signer", "crates/iptv-sapi",
]

[workspace.package]
edition = "2021"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
iptv-core = { path = "crates/iptv-core" }
wxdragon = "0.9.24"
live-region = "0.3.3"
serde_json = "1"
sha2 = "0.11"
ureq = "3"
quick-xml = "0.42"
flate2 = "1"
fs4 = "1.1.0"
chrono = "0.4"
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
libloading = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
hmac = "0.13"
pbkdf2 = "0.13"
base64 = "0.23"
getrandom = "0.4"
