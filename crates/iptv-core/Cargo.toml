[dependencies]
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true
quick-xml.workspace = true
flate2.workspace = true
fs4.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
rusqlite.workspace = true
serde.workspace = true
aes.workspace = true
cbc.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
base64.workspace = true
getrandom.workspace = true
patois = "0.3"
rust_cast.workspace = true
mdns-sd.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[package]
name = "iptv-core"
version = "0.4.26"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# patois collects this crate's marked strings into the app's catalog.
[package.metadata.patois]
translatable = true

[lints.rust]
# Deny, not forbid: the audited platform FFI exceptions
# (epgstore's pid probe, epg's thread priority) carry
# per-function #[allow(unsafe_code)] with SAFETY notes;
# everything else in this crate stays unsafe-free.
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
