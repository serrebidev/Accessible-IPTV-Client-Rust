[package]
name = "iptv-app"
version = "0.4.21"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
serde_json.workspace = true
iptv-core.workspace = true
iptv-vlc = { path = "../iptv-vlc" }
iptv-sapi = { path = "../iptv-sapi" }
ship-shape = "0.5.0"
# See the workspace root Cargo.toml for why wxdragon's
# default features are off (the wx-asserts dialog class,
# validation 0095); every other default is re-enabled here.
wxdragon = { workspace = true, features = [
    "media-ctrl",
    "wx-printing",
    "wx-tiff",
    "wx-jpeg",
    "wx-tango-icons",
    "wx-extra-image-formats",
    "wx-regex",
    "appindicator",
] }
live-region.workspace = true
sha2.workspace = true
ureq.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"