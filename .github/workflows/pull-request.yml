name: Pull Request Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Rust port
    runs-on: wsl-linux
    steps:
      - name: Check out Rust port
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Linux builds run on desknasbox's WSL (runner wsl-linux-x64) in a job
      # container. The runner mounts persistent volumes at
      # /root/forgejo-runner/cargo-target and cargo's registry and git
      # caches, so target/ points at a fixed folder there exactly as on
      # the host runners, and the job image ships the apt packages and
      # Rust (owner request 2026-11-11: Linux as fast as the other legs).
      # CARGO_TARGET_DIR is the real path: CMake caches absolute paths.
      - name: Persistent target folder (Linux WSL runner)
        shell: bash
        run: |
          dir="$HOME/forgejo-runner/cargo-target/Accessible-IPTV-Client-Rust/pull-request"
          mkdir -p "$dir"
          rm -rf target
          ln -s "$dir" target
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install wxWidgets build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libwebkit2gtk-4.1-dev libsecret-1-dev libnotify-dev libsdl2-dev \
            libjpeg-dev libtiff-dev clang libclang-dev pkg-config gettext

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check out pinned Python reference
        uses: actions/checkout@v4
        with:
          repository: serrebidev/Accessible-IPTV-Client
          ref: 9aa89e053225ef2c83c4f3659775a00723012ff7
          path: python-reference
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Typecheck
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Playlist parity
        run: python tools/check-playlist-parity.py python-reference

      - name: Diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      # Drop only the link, never the shared folder behind it.
      - name: Unlink persistent target folder (Linux)
        if: always()
        shell: bash
        run: rm -f target
