name: Pull Request Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Rust port
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rust port
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install wxWidgets build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libwebkit2gtk-4.1-dev libsecret-1-dev libnotify-dev libsdl2-dev \
            libjpeg-dev libtiff-dev clang libclang-dev pkg-config gettext

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check out pinned Python reference
        uses: actions/checkout@v4
        with:
          repository: serrebidev/Accessible-IPTV-Client
          ref: 9aa89e053225ef2c83c4f3659775a00723012ff7
          path: python-reference
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Typecheck
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Playlist parity
        run: python tools/check-playlist-parity.py python-reference

      - name: Diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
