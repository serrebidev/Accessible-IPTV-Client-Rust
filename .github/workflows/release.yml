name: Release

# Builds, gates, packages and publishes a release for a version tag.
# Layout and manifest contract: PACKAGING.md. Approved by Brandon
# 2026-11-01 (workflow changes need his direct OK in this repo).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            asset_suffix: windows-x64
            binary: iptv-app.exe
          - name: linux
            os: ubuntu-latest
            asset_suffix: linux-x64
            binary: iptv-app
          - name: macos
            os: macos-latest
            asset_suffix: macos-arm64
            binary: iptv-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install wxWidgets build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libwebkit2gtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Gates
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build
        run: cargo build --release -p iptv-app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $stage = "accessible-iptv-client-$tag-${{ matrix.asset_suffix }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" $stage
          Copy-Item "docs/help" "$stage/docs/help" -Recurse
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          stage="accessible-iptv-client-${tag}-${{ matrix.asset_suffix }}"
          mkdir -p "$stage/docs"
          cp "target/release/${{ matrix.binary }}" "$stage/"
          cp -R docs/help "$stage/docs/help"
          tar -czf "$stage.tar.gz" "$stage"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.asset_suffix }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Collect packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Write update manifest
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          asset="accessible-iptv-client-${tag}-windows-x64.zip"
          sha="$(sha256sum "dist/$asset" | cut -d' ' -f1)"
          published="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > dist/update-manifest.json <<EOF
          {
            "version": "$version",
            "asset_filename": "$asset",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${tag}/${asset}",
            "sha256": "$sha",
            "published_date": "$published"
          }
          EOF
          cat dist/update-manifest.json

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Accessible IPTV Client ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
