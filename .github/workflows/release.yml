name: Release

# Builds, gates, packages and publishes a release for a version tag.
# Layout and manifest contract: PACKAGING.md. Approved by Brandon
# 2026-11-01 (workflow changes need his direct OK in this repo).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            asset_suffix: windows-x64
            binary: iptv-app.exe
          # Linux builds in WSL on the build PC (owner rule
          # 2026-11-09), as BlindRadio's release does.
          - name: linux
            os: wsl-linux
            asset_suffix: linux-x64
            binary: iptv-app
          - name: macos
            os: macos-latest
            asset_suffix: macos-arm64
            binary: iptv-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install wxWidgets build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libwebkit2gtk-4.1-dev libsecret-1-dev libnotify-dev libsdl2-dev \
            libjpeg-dev libtiff-dev clang libclang-dev pkg-config gettext \
            cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Host runners (macOS, Windows) start every job in a fresh,
      # randomly named work folder, so rust-cache never matched
      # there: its cache version hashes the absolute target path
      # ("No cache found", full rebuilds every run). target/ points
      # at a fixed folder on the runner instead and builds reuse the
      # previous run directly. Two jobs on one folder take turns:
      # cargo locks its target folder.
      # CARGO_TARGET_DIR is the folder's real path: CMake caches
      # absolute paths, and the path through the link changes
      # with every work folder ("CMakeCache.txt directory ... is
      # different"). The link keeps target/... references working.
      # Owner-approved 2026-11-10 (same fix as BlindRSS-Rust df47812).
      # ponytail: the folder only grows; delete it on the runner
      # when disk gets tight (next build is cold once).
      - name: Persistent target folder (Windows host runner)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = 'C:/forgejo-runner/cargo-target/Accessible-IPTV-Client-Rust/build'
          New-Item -ItemType Directory -Force $dir | Out-Null
          if (Test-Path target) { cmd /c rmdir /s /q target }
          New-Item -ItemType Junction -Path target -Target $dir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$dir"

      - name: Persistent target folder (macOS host runner)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dir="$HOME/forgejo-runner/cargo-target/Accessible-IPTV-Client-Rust/build"
          mkdir -p "$dir"
          rm -rf target
          ln -s "$dir" target
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      # Linux legs run on desknasbox's WSL (runner wsl-linux-x64) in a job
      # container. The runner mounts persistent volumes at
      # /root/forgejo-runner/cargo-target and cargo's registry and git
      # caches, so target/ points at a fixed folder there exactly as on
      # the host runners, and the job image ships the apt packages and
      # Rust (owner request 2026-11-11: Linux as fast as the other legs).
      # CARGO_TARGET_DIR is the real path: CMake caches absolute paths.
      - name: Persistent target folder (Linux WSL runner)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dir="$HOME/forgejo-runner/cargo-target/Accessible-IPTV-Client-Rust/build"
          mkdir -p "$dir"
          rm -rf target
          ln -s "$dir" target
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      # patois-build compiles the catalogs with msgfmt; without
      # gettext the build succeeds but ships no translations.
      - name: Install gettext (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The Forgejo Windows runner has gettext preinstalled and no
          # admin rights for choco; install only where it is missing.
          if (-not (Test-Path "C:\Program Files\gettext-iconv\bin\msgfmt.exe")) {
            choco install gettext -y --no-progress
          }
          # The choco package does not put msgfmt on PATH for
          # later steps; without it patois-build only warns and
          # the build silently ships no translations. Find the
          # binary, publish its folder, and prove it runs.
          $candidates = @(
            "C:\Program Files\gettext-iconv\bin",
            "C:\Program Files (x86)\gettext-iconv\bin",
            "C:\Program Files\gettext-utils\bin",
            "C:\tools\gettext\bin"
          )
          $bin = $candidates | Where-Object { Test-Path "$_\msgfmt.exe" } | Select-Object -First 1
          if (-not $bin) {
            $found = Get-ChildItem "C:\Program Files", "C:\Program Files (x86)", "C:\ProgramData\chocolatey" -Filter msgfmt.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $bin = $found.DirectoryName }
          }
          if (-not $bin) { throw "msgfmt.exe not found after choco install gettext" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          $env:Path = "$bin;$env:Path"
          msgfmt --version | Select-Object -First 1

      - name: Install gettext (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gettext
          echo "/opt/homebrew/opt/gettext/bin" >> "$GITHUB_PATH"

      # The Linux binary gets an $ORIGIN rpath so the libVLC copy
      # bundled beside it in the package is found at runtime.
      - name: Set rpath for bundled libVLC (Linux)
        if: runner.os == 'Linux'
        run: echo 'RUSTFLAGS=-C link-args=-Wl,-rpath,$ORIGIN' >> "$GITHUB_ENV"

      - name: Gates
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build
        run: cargo build --release -p iptv-app

      # Bundle the libVLC runtime beside the binary so the built-in
      # player works with no VLC install (PACKAGING.md). The app
      # loads the bundled copy first on every platform.
      - name: Bundle libVLC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $index = (Invoke-WebRequest -UseBasicParsing "https://download.videolan.org/pub/videolan/vlc/").Content
          # Newest 3.x only: the engine binds the libVLC 3 API (validation 0071).
          $ver = ([regex]::Matches($index, 'href="(3\.[0-9]+\.[0-9]+)/"') | ForEach-Object { [version]$_.Groups[1].Value } | Sort-Object -Descending | Select-Object -First 1).ToString()
          Write-Host "Bundling libVLC from VLC $ver"
          New-Item -ItemType Directory -Force vlc-src | Out-Null
          Invoke-WebRequest -UseBasicParsing "https://download.videolan.org/pub/videolan/vlc/$ver/win64/vlc-$ver-win64.zip" -OutFile vlc-src/vlc.zip
          Expand-Archive vlc-src/vlc.zip -DestinationPath vlc-dist
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item "vlc-dist/vlc-$ver/libvlc.dll", "vlc-dist/vlc-$ver/libvlccore.dll" bundle
          Copy-Item "vlc-dist/vlc-$ver/plugins" "bundle/plugins" -Recurse

      - name: Bundle libVLC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libvlc5 libvlccore9 vlc-plugin-base
          mkdir -p bundle/plugins
          cp -a /usr/lib/x86_64-linux-gnu/libvlc.so.5* /usr/lib/x86_64-linux-gnu/libvlccore.so.9* bundle/
          cp -a /usr/lib/x86_64-linux-gnu/vlc/plugins/. bundle/plugins/

      - name: Bundle libVLC (macOS)
        if: runner.os == 'macOS'
        run: |
          # Newest 3.x only: the engine binds the libVLC 3 API (validation 0071).
          ver="$(curl -s https://download.videolan.org/pub/videolan/vlc/ | sed -n 's/.*href="\(3\.[0-9.]*\)\/".*/\1/p' | sort -V | tail -1)"
          echo "Bundling libVLC from VLC $ver"
          mkdir -p vlc-src
          curl -sL -o vlc-src/vlc.dmg "https://download.videolan.org/pub/videolan/vlc/$ver/macosx/vlc-$ver-arm64.dmg"
          hdiutil attach vlc-src/vlc.dmg -nobrowse -mountpoint /tmp/vlcapp
          mkdir -p bundle/plugins
          cp -a /tmp/vlcapp/VLC.app/Contents/MacOS/lib/libvlc*.dylib /tmp/vlcapp/VLC.app/Contents/MacOS/lib/libvlccore*.dylib bundle/
          cp -a /tmp/vlcapp/VLC.app/Contents/MacOS/plugins/. bundle/plugins/
          hdiutil detach /tmp/vlcapp

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $stage = "accessible-iptv-client-$tag-${{ matrix.asset_suffix }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" $stage
          Copy-Item "docs/help" "$stage/docs/help" -Recurse
          Copy-Item "bundle/libvlc.dll", "bundle/libvlccore.dll" $stage
          Copy-Item "bundle/plugins" "$stage/plugins" -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath "accessible-iptv-client.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          stage="accessible-iptv-client-${tag}-${{ matrix.asset_suffix }}"
          mkdir -p "$stage/docs"
          cp "target/release/${{ matrix.binary }}" "$stage/"
          cp -R docs/help "$stage/docs/help"
          cp -a bundle/. "$stage/"
          tar -czf accessible-iptv-client.tar.gz -C "$stage" .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          stage="accessible-iptv-client-${tag}-${{ matrix.asset_suffix }}"
          mkdir -p "$stage/docs"
          cp "target/release/${{ matrix.binary }}" "$stage/"
          cp -R docs/help "$stage/docs/help"
          cp -a bundle/. "$stage/"
          hdiutil create -volname "Accessible IPTV Client" -srcfolder "$stage" -ov -format UDZO accessible-iptv-client.dmg

      - name: Upload package
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: package-${{ matrix.asset_suffix }}
          path: |
            *.zip
            *.tar.gz
            *.dmg
          if-no-files-found: error

      # Drop only the link, never the shared folder behind it,
      # before the runner deletes the work folder.
      - name: Unlink persistent target folder (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path target) { (Get-Item target).Delete() }

      - name: Unlink persistent target folder (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f target

      - name: Unlink persistent target folder (Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: rm -f target

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Collect packages
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Signed updates (ship-shape): every downloadable asset gets a
      # .minisig sibling, signed with the repo's MINISIGN_KEY secret
      # (same keypair as BlindRadio). Publish refuses to proceed
      # when any signature is missing — an unsigned asset would
      # make the updater silently offer nothing.
      - name: Sign release assets
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          cargo build --release -p iptv-signer
          ./target/release/iptv-signer dist/accessible-iptv-client.zip dist/accessible-iptv-client.tar.gz dist/accessible-iptv-client.dmg
          for f in dist/accessible-iptv-client.zip dist/accessible-iptv-client.tar.gz dist/accessible-iptv-client.dmg; do
            test -f "$f.minisig" || { echo "missing signature for $f"; exit 1; }
          done

      - name: Write update manifest
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          asset="accessible-iptv-client.zip"
          sha="$(sha256sum "dist/$asset" | cut -d' ' -f1)"
          published="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > dist/update-manifest.json <<EOF
          {
            "version": "$version",
            "asset_filename": "$asset",
            "download_url": "${{ github.server_url }}/${{ github.repository }}/releases/download/${tag}/${asset}",
            "sha256": "$sha",
            "published_date": "$published"
          }
          EOF
          cat dist/update-manifest.json

      # The release body is the tag's section of CHANGELOG.md
      # (BlindRadio's rule, adopted at Brandon's direct OK
      # 2026-11-07). A missing section fails the publish
      # instead of shipping an empty release page.
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - "$TAG" <<'PY'
          import sys
          version = sys.argv[1].lstrip("v")
          head = f"## {version}"
          notes, inside = [], False
          for line in open("CHANGELOG.md").read().splitlines():
              if line.startswith("## "):
                  inside = line.strip() == head
                  if inside:
                      continue
                  if notes:
                      break
              if inside:
                  notes.append(line)
          body = "\n".join(notes).strip()
          if not body:
              sys.exit(f"CHANGELOG.md has no section for {version}; refusing to publish empty notes")
          open("release-notes.md", "w").write(body + "\n")
          print(body)
          PY

      # Forgejo release API (the GitHub release action does not work
      # here). Draft first, so the release never shows without its
      # files; publish only once every asset is attached.
      - name: Publish
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          h="Authorization: token $FORGEJO_TOKEN"
          id="$(jq -n --arg tag "$TAG" --arg name "Accessible IPTV Client $TAG" --rawfile body release-notes.md \
            '{tag_name: $tag, name: $name, body: $body, draft: true}' |
            curl -sf -H "$h" -H 'Content-Type: application/json' -d @- "$api/releases" | jq -r .id)"
          for file in dist/*; do
            name="$(basename "$file")"
            curl -sf -o /dev/null -H "$h" -F "attachment=@$file" "$api/releases/$id/assets?name=$name"
            echo "Attached $name"
          done
          present="$(curl -sf -H "$h" "$api/releases/$id" | jq -r '.assets[].name')"
          for file in dist/*; do
            grep -qx "$(basename "$file")" <<<"$present" || { echo "missing: $file"; exit 1; }
          done
          curl -sf -o /dev/null -X PATCH -H "$h" -H 'Content-Type: application/json' \
            -d '{"draft": false, "prerelease": false}' "$api/releases/$id"
          test "$(curl -sf "$api/releases/latest" | jq -r .tag_name)" = "$TAG"
