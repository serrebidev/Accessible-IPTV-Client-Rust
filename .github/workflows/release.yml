name: Release

# Builds, gates, packages and publishes a release for a version tag.
# Layout and manifest contract: PACKAGING.md. Approved by Brandon
# 2026-11-01 (workflow changes need his direct OK in this repo).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            asset_suffix: windows-x64
            binary: iptv-app.exe
          - name: linux
            os: ubuntu-latest
            asset_suffix: linux-x64
            binary: iptv-app
          - name: macos
            os: macos-latest
            asset_suffix: macos-arm64
            binary: iptv-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install wxWidgets build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libwebkit2gtk-4.1-dev libsecret-1-dev libnotify-dev libsdl2-dev \
            libjpeg-dev libtiff-dev clang libclang-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The Linux binary gets an $ORIGIN rpath so the libVLC copy
      # bundled beside it in the package is found at runtime.
      - name: Set rpath for bundled libVLC (Linux)
        if: runner.os == 'Linux'
        run: echo 'RUSTFLAGS=-C link-args=-Wl,-rpath,$ORIGIN' >> "$GITHUB_ENV"

      - name: Gates
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build
        run: cargo build --release -p iptv-app

      # Bundle the libVLC runtime beside the binary so the built-in
      # player works with no VLC install (PACKAGING.md). The app
      # loads the bundled copy first on every platform.
      - name: Bundle libVLC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $index = (Invoke-WebRequest -UseBasicParsing "https://download.videolan.org/pub/videolan/vlc/").Content
          # Newest 3.x only: the engine binds the libVLC 3 API (validation 0071).
          $ver = ([regex]::Matches($index, 'href="(3\.[0-9]+\.[0-9]+)/"') | ForEach-Object { [version]$_.Groups[1].Value } | Sort-Object -Descending | Select-Object -First 1).ToString()
          Write-Host "Bundling libVLC from VLC $ver"
          New-Item -ItemType Directory -Force vlc-src | Out-Null
          Invoke-WebRequest -UseBasicParsing "https://download.videolan.org/pub/videolan/vlc/$ver/win64/vlc-$ver-win64.zip" -OutFile vlc-src/vlc.zip
          Expand-Archive vlc-src/vlc.zip -DestinationPath vlc-dist
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item "vlc-dist/vlc-$ver/libvlc.dll", "vlc-dist/vlc-$ver/libvlccore.dll" bundle
          Copy-Item "vlc-dist/vlc-$ver/plugins" "bundle/plugins" -Recurse

      - name: Bundle libVLC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libvlc5 libvlccore9 vlc-plugin-base
          mkdir -p bundle/plugins
          cp -a /usr/lib/x86_64-linux-gnu/libvlc.so.5* /usr/lib/x86_64-linux-gnu/libvlccore.so.9* bundle/
          cp -a /usr/lib/x86_64-linux-gnu/vlc/plugins/. bundle/plugins/

      - name: Bundle libVLC (macOS)
        if: runner.os == 'macOS'
        run: |
          # Newest 3.x only: the engine binds the libVLC 3 API (validation 0071).
          ver="$(curl -s https://download.videolan.org/pub/videolan/vlc/ | sed -n 's/.*href="\(3\.[0-9.]*\)\/".*/\1/p' | sort -V | tail -1)"
          echo "Bundling libVLC from VLC $ver"
          mkdir -p vlc-src
          curl -sL -o vlc-src/vlc.dmg "https://download.videolan.org/pub/videolan/vlc/$ver/macosx/vlc-$ver-arm64.dmg"
          hdiutil attach vlc-src/vlc.dmg -nobrowse -mountpoint /tmp/vlcapp
          mkdir -p bundle/plugins
          cp -a /tmp/vlcapp/VLC.app/Contents/MacOS/lib/libvlc*.dylib /tmp/vlcapp/VLC.app/Contents/MacOS/lib/libvlccore*.dylib bundle/
          cp -a /tmp/vlcapp/VLC.app/Contents/MacOS/plugins/. bundle/plugins/
          hdiutil detach /tmp/vlcapp

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $stage = "accessible-iptv-client-$tag-${{ matrix.asset_suffix }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" $stage
          Copy-Item "docs/help" "$stage/docs/help" -Recurse
          Copy-Item "locale" "$stage/locale" -Recurse
          Copy-Item "bundle/libvlc.dll", "bundle/libvlccore.dll" $stage
          Copy-Item "bundle/plugins" "$stage/plugins" -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath "accessible-iptv-client.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          stage="accessible-iptv-client-${tag}-${{ matrix.asset_suffix }}"
          mkdir -p "$stage/docs"
          cp "target/release/${{ matrix.binary }}" "$stage/"
          cp -R docs/help "$stage/docs/help"
          cp -R locale "$stage/locale"
          cp -a bundle/. "$stage/"
          tar -czf accessible-iptv-client.tar.gz -C "$stage" .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          stage="accessible-iptv-client-${tag}-${{ matrix.asset_suffix }}"
          mkdir -p "$stage/docs"
          cp "target/release/${{ matrix.binary }}" "$stage/"
          cp -R docs/help "$stage/docs/help"
          cp -R locale "$stage/locale"
          cp -a bundle/. "$stage/"
          hdiutil create -volname "Accessible IPTV Client" -srcfolder "$stage" -ov -format UDZO accessible-iptv-client.dmg

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.asset_suffix }}
          path: |
            *.zip
            *.tar.gz
            *.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Collect packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Signed updates (ship-shape): every downloadable asset gets a
      # .minisig sibling, signed with the repo's MINISIGN_KEY secret
      # (same keypair as BlindRadio). Publish refuses to proceed
      # when any signature is missing — an unsigned asset would
      # make the updater silently offer nothing.
      - name: Sign release assets
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          cargo build --release -p iptv-signer
          ./target/release/iptv-signer dist/accessible-iptv-client.zip dist/accessible-iptv-client.tar.gz dist/accessible-iptv-client.dmg
          for f in dist/accessible-iptv-client.zip dist/accessible-iptv-client.tar.gz dist/accessible-iptv-client.dmg; do
            test -f "$f.minisig" || { echo "missing signature for $f"; exit 1; }
          done

      - name: Write update manifest
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          asset="accessible-iptv-client.zip"
          sha="$(sha256sum "dist/$asset" | cut -d' ' -f1)"
          published="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > dist/update-manifest.json <<EOF
          {
            "version": "$version",
            "asset_filename": "$asset",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${tag}/${asset}",
            "sha256": "$sha",
            "published_date": "$published"
          }
          EOF
          cat dist/update-manifest.json

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Accessible IPTV Client ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
